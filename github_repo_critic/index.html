<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>github repo critic</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .entry {
      padding-bottom: 4px;
    }

    .empty {
      font-style: normal;
    }
  </style>
</head>
<body>
  <main>
    <h1>github repo critic</h1>

    <header>
      <p>这里存放我对 GitHub 上一些 repo 的简短批评、观察和使用札记。</p>
      <p class="meta">plain html / minimalist / courier only</p>
    </header>

    <article class="entry rule-block">
      <h2>待记录</h2>
      <p class="empty muted">还没有正式条目。之后可以按 repo、日期、结论和链接追加。</p>
      <ul>
        <li>repo: <a href="https://github.com/" rel="noreferrer">github.com/...</a></li>
        <li>critic: 一句话指出问题或亮点。</li>
        <li>notes: 证据、上下文、替代方案。</li>
      </ul>
    </article>

    <footer>
      <p><a href="/">back home</a></p>
    </footer>
  </main>
</body>
</html>
